# PR labeler config for release-drafter/release-drafter.
#
# Labels are applied based on which files are changed in a PR.
# Order matters: the last matching rule wins for each label.

labels:
  - label: documentation
    files:
      - "*.md"
      - "*.mdx"

  - label: translation
    files:
      - "lib/l10n/*.arb"

  - label: dependencies
    files:
      - "pubspec.yaml"
      - "pubspec.lock"

  - label: github_actions
    files:
      - ".github/workflows/*"

  - label: bug
    files:
      - "lib/**/*.dart"
    title:
      - "fix:"
      - "bug:"

  - label: enhancement
    files:
      - "lib/**/*.dart"
    title:
      - "feat:"
      - "feature:"
