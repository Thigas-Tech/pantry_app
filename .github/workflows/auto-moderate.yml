name: Auto-moderate
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPr = context.payload.pull_request !== undefined;
            const item = isPr ? context.payload.pull_request : context.payload.issue;
            const author = item.user.login;

            // In-app feedback (via GithubIssueService) always carries the
            // from-app label — allow it through without further checks.
            if (!isPr && item.labels.some(l => l.name === 'from-app')) {
              console.log(`Issue has from-app label — allowing`);
              return;
            }

            // Check if the author has admin/maintain/write access to the
            // repository.  This works for both direct collaborators and
            // organisation members on public repos (the GITHUB_TOKEN has
            // sufficient scope for getCollaboratorPermissionLevel).
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              if (['admin', 'maintain', 'write'].includes(perm.role_name)) {
                console.log(`${author} has ${perm.role_name} access — allowing`);
                return;
              }
            } catch (e) {
              console.log(`Permission check for ${author} failed: ${e.message}`);
            }

            console.log(`External ${isPr ? 'PR' : 'issue'} from ${author} — closing and locking`);

            const body = [
              'Thank you for your interest in Pantry App.',
              '',
              'This repository does not accept external issues or pull requests directly.',
              'To report a bug or suggest a feature, please use the **in-app feedback button**',
              '(Settings > Report an issue) inside the Pantry App.',
              '',
              'This has been automatically closed and locked.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              body: body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

            await github.rest.issues.lock({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              lock_reason: 'spam',
            });
