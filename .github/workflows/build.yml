name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_debug_apk:
    name: Build debug apk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Build debug apk
        run: flutter build apk --debug
        working-directory: code
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: code/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
          if-no-files-found: error

  build_release:
    name: Build release artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Build release apk
        run: >
          flutter build apk --release --obfuscate
          --split-debug-info=./debug-info
        working-directory: code
      - name: Build release appbundle
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=./debug-info
        working-directory: code
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: code/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: code/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: release-debug-info
          path: code/debug-info/
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-*'
          merge-multiple: true
      - name: Check if release exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json tagName &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --prerelease \
            artifacts/*
