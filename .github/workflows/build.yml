name: Build

on:
  push:
    branches:
      - main

jobs:
  security_hardening:
    name: Check security hardening
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9

  testing:
    name: Run ${{ matrix.category }} testing
    needs: security_hardening
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          - static
          - unit
          - widget
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Inject environment
        working-directory: code
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ./scripts/inject_env.sh \
            "${OFF_USER_ID:-}" \
            "${OFF_PASSWORD:-}" \
            "${CONTACT_EMAIL:-pantry-app@example.com}" \
            "false"
      - name: Analyze Flutter
        if: matrix.category == 'static'
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: code
      - name: Run Flutter ${{ matrix.category }} tests
        if: matrix.category != 'static'
        run: flutter test --no-pub --concurrency=2 --coverage --coverage-path=./coverage/lcov.${{ matrix.category }}.info test/${{ matrix.category }}s
        working-directory: code
      - name: Upload code coverage to GitHub
        if: matrix.category != 'static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-coverage-${{ matrix.category }}
          path: code/coverage/lcov.${{ matrix.category }}.info

  build:
    name: Build artifacts
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Inject environment
        working-directory: code
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ./scripts/inject_env.sh \
            "${OFF_USER_ID:-}" \
            "${OFF_PASSWORD:-}" \
            "${CONTACT_EMAIL:-pantry-app@example.com}" \
            "false"
      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: code
      - name: Build App Bundle (debug)
        run: flutter build appbundle --debug
        working-directory: code
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-debug-apk
          path: code/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-debug-aab
          path: code/build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 7
