name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security_hardening:
    name: Check security hardening
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9

  testing:
    name: Run ${{ matrix.category }} testing
    if: github.event_name == 'push'
    needs: security_hardening
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          - static
          - unit
          - widget
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Inject environment
        working-directory: code
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          USE_OFF_STAGING: ${{ vars.USE_OFF_STAGING || 'false' }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || 'Thigas-Tech' }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || 'pantry_app' }}
          FEEDBACK_ENABLED: ${{ vars.FEEDBACK_ENABLED || 'true' }}
          OPEN_PRICES_TOKEN: ${{ secrets.OPEN_PRICES_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FIREBASE_ENABLED: ${{ vars.FIREBASE_ENABLED || 'false' }}
        run: |
          env \
            | grep -E '^(OFF_USER_ID|OFF_PASSWORD|CONTACT_EMAIL|FEEDBACK_TOKEN|USE_OFF_STAGING|GITHUB_OWNER|GITHUB_REPO|FEEDBACK_ENABLED|OPEN_PRICES_TOKEN|USDA_API_KEY|FIREBASE_ENABLED)=' \
            > .env
      - name: Analyze Flutter
        if: matrix.category == 'static'
        run: dart analyze
        working-directory: code
      - name: Run Flutter ${{ matrix.category }} tests
        if: matrix.category != 'static'
        run: >
          flutter test --no-pub --concurrency=2 --coverage
          --coverage-path=./coverage/lcov.${{ matrix.category }}.info
          ${{ matrix.category == 'unit' && 'test/config_test.dart test/database test/models test/providers test/services test/utils' || 'test/widgets test/screens' }}
        working-directory: code
      - name: Upload code coverage to GitHub
        if: matrix.category != 'static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-coverage-${{ matrix.category }}
          path: code/coverage/lcov.${{ matrix.category }}.info
          if-no-files-found: error

  build:
    # TODO: Add Patrol E2E tests here once implemented
    name: Build ${{ matrix.build-type }} ${{ matrix.package-type }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [debug, release]
        package-type: [apk, appbundle]
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Inject environment
        working-directory: code
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          USE_OFF_STAGING: ${{ vars.USE_OFF_STAGING || 'false' }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || 'Thigas-Tech' }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || 'pantry_app' }}
          FEEDBACK_ENABLED: ${{ vars.FEEDBACK_ENABLED || 'true' }}
          OPEN_PRICES_TOKEN: ${{ secrets.OPEN_PRICES_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FIREBASE_ENABLED: ${{ vars.FIREBASE_ENABLED || 'false' }}
        run: |
          env \
            | grep -E '^(OFF_USER_ID|OFF_PASSWORD|CONTACT_EMAIL|FEEDBACK_TOKEN|USE_OFF_STAGING|GITHUB_OWNER|GITHUB_REPO|FEEDBACK_ENABLED|OPEN_PRICES_TOKEN|USDA_API_KEY|FIREBASE_ENABLED)=' \
            > .env
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
        working-directory: code
      - name: Build ${{ matrix.build-type }} ${{ matrix.package-type }}
        if: |
          github.event_name != 'pull_request' ||
          (matrix.build-type == 'debug' && matrix.package-type == 'apk')
        run: >
          flutter build ${{ matrix.package-type }}
          --${{ matrix.build-type }}
          ${{ matrix.build-type == 'release' && '--obfuscate --split-debug-info=./debug-info' || '' }}
        working-directory: code
      - name: Upload APK
        if: matrix.package-type == 'apk' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.build-type }}-apk
          path: code/build/app/outputs/flutter-apk/app-${{ matrix.build-type }}.apk
          retention-days: 90
          if-no-files-found: error
      - name: Upload AAB
        if: matrix.package-type == 'appbundle' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.build-type }}-aab
          path: code/build/app/outputs/bundle/${{ matrix.build-type }}/app-${{ matrix.build-type }}.aab
          retention-days: 90
          if-no-files-found: error
      - name: Upload debug symbols
        if: matrix.build-type == 'release' && matrix.package-type == 'apk' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-debug-info
          path: code/debug-info/
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: '*-*'
          merge-multiple: true
      - name: Check if release exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json tagName &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --prerelease \
            artifacts/*
