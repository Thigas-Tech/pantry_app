name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  security_hardening:
    name: Check security hardening
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9

  testing:
    name: Run ${{ matrix.category }} testing
    needs: security_hardening
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          - static
          - unit
          - widget
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: code
      - name: Get Flutter version
        id: get-flutter-version
        uses: zgosalvez/github-actions-get-flutter-version-env@db80c000d15b0a11d86bfa4d5a9dc885f054f46d
        with:
          pubspec-file-path: code/pubspec.yaml
      - name: Cache Flutter
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: flutter
          key: ${{ env.cache-name }}-ubuntu-latest-${{ steps.get-flutter-version.outputs.version }}-${{ hashFiles('code/pubspec.lock') }}
          restore-keys: |
            ${{ env.cache-name }}-ubuntu-latest-${{ steps.get-flutter-version.outputs.version }}-
            ${{ env.cache-name }}-ubuntu-latest-
            ${{ env.cache-name }}-
        env:
          cache-name: flutter-cache
      - name: Clone the Flutter repository
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: flutter/flutter
          ref: ${{ steps.get-flutter-version.outputs.version }}
          path: flutter
      - name: Add the flutter tool to the path
        run: |
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH
      - name: Populate the Flutter tool's cache of binary artifacts
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          flutter config --no-analytics
          flutter precache
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Analyze Flutter
        if: matrix.category == 'static'
        uses: zgosalvez/github-actions-analyze-dart@e0ecdf9d71924700dec2d2e9b52ab08fe606142d
        with:
          fail-on-warnings: true
          working-directory: code
      - name: Run Flutter ${{ matrix.category }} tests
        if: matrix.category != 'static'
        run: flutter test --no-pub --concurrency=2 --coverage --coverage-path=./coverage/lcov.${{ matrix.category }}.info test/${{ matrix.category }}s
        working-directory: code
      - name: Upload code coverage to GitHub
        if: matrix.category != 'static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-coverage-${{ matrix.category }}
          path: code/coverage/lcov.${{ matrix.category }}.info

  coverage_report:
    name: Generate coverage report
    needs: testing
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@6c1aa0cc9e1c02f9f58f01ac599f1064ccc83470
      - name: Download code coverage from GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: coverage
          pattern: code-coverage-*
          merge-multiple: true
      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@0e97540271bfaece1ddff20e7fa8d9a6ab1abf67
        with:
          coverage-files: coverage/lcov.*.info
          minimum-coverage: 0
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
