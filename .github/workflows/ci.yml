name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    name: Run ${{ matrix.category }} testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          - static
          - unit
          - widget
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Create .env for CI
        run: |
          echo "OFF_USER_ID=ci" > code/.env
          echo "OFF_PASSWORD=ci" >> code/.env
          echo "CONTACT_EMAIL=ci@pantry-app.dev" >> code/.env
      - name: Check version ahead of latest release
        if: matrix.category == 'static' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[].filename')
          APP_CHANGED=$(printf '%s\n' "$FILES" \
            | grep -vE '^docs/|^\.github/|^LICENSE$|^\.env\.example$|\.md$' || true)
          if [ -z "$APP_CHANGED" ]; then
            echo "Docs/CI-only change — version bump not required."
            exit 0
          fi
          PUBSPEC_VER=$(grep '^version: ' code/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          if gh release view "v$PUBSPEC_VER" --repo "$GITHUB_REPOSITORY" --json tagName &>/dev/null; then
            echo "ERROR: version $PUBSPEC_VER already has a release on GitHub."
            echo "Bump the version in pubspec.yaml before merging."
            exit 1
          fi
          echo "Version v$PUBSPEC_VER is ahead of latest release — OK"
      - name: Check formatting
        if: matrix.category == 'static'
        working-directory: code
        run: |
          FILES=$(git ls-files 'lib/**/*.dart' 'test/**/*.dart' | grep -v 'app_localizations')
          dart format --output=none --set-exit-if-changed $FILES
      - name: Check doc comments for backticks
        if: matrix.category == 'static'
        working-directory: code
        run: |
          HITS=$(grep -rnE '///.*`' lib test --include='*.dart' \
            | grep -vE '\.g\.dart|\.freezed\.dart|app_localizations' || true)
          if [ -n "$HITS" ]; then
            echo "Backticks found in doc comments. Use [square brackets]"
            echo "for cross-references or plain text instead."
            echo "$HITS"
            exit 1
          fi
          echo "No backticks in doc comments — OK"
      - name: Analyze Flutter
        if: matrix.category == 'static'
        run: dart analyze lib/ test/
        working-directory: code
      - name: Run Flutter ${{ matrix.category }} tests
        if: matrix.category != 'static'
        run: >
          flutter test --no-pub --concurrency=2 --coverage
          --coverage-path=./coverage/lcov.${{ matrix.category }}.info
          ${{ matrix.category == 'unit' && 'test/config_test.dart test/database test/models test/providers test/services test/utils' || 'test/widgets test/screens' }}
        working-directory: code
      - name: Upload code coverage to GitHub
        if: matrix.category != 'static'
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.category }}
          path: code/coverage/lcov.${{ matrix.category }}.info
          if-no-files-found: error
