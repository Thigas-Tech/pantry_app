name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security_hardening:
    name: Check security hardening
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@60e3a74c7b74a319e8e53e46bc455205f7173e1a

  testing:
    name: Run ${{ matrix.category }} testing
    needs: security_hardening
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category:
          - static
          - unit
          - widget
      fail-fast: false
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: code
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Get Flutter packages
        run: flutter pub get
        working-directory: code
      - name: Create .env for CI
        run: |
          echo "OFF_USER_ID=ci" > code/.env
          echo "OFF_PASSWORD=ci" >> code/.env
          echo "CONTACT_EMAIL=ci@pantry-app.dev" >> code/.env
      - name: Check version ahead of latest release
        if: matrix.category == 'static'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBSPEC_VER=$(grep '^version: ' code/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          if gh release view "v$PUBSPEC_VER" --json tagName &>/dev/null; then
            echo "ERROR: version $PUBSPEC_VER already has a release on GitHub."
            echo "Bump the version in pubspec.yaml before merging."
            exit 1
          fi
          echo "Version v$PUBSPEC_VER is ahead of latest release — OK"
      - name: Analyze Flutter
        if: matrix.category == 'static'
        run: dart analyze lib/ test/
        working-directory: code
      - name: Run Flutter ${{ matrix.category }} tests
        if: matrix.category != 'static'
        run: >
          flutter test --no-pub --concurrency=2 --coverage
          --coverage-path=./coverage/lcov.${{ matrix.category }}.info
          ${{ matrix.category == 'unit' && 'test/config_test.dart test/database test/models test/providers test/services test/utils' || 'test/widgets test/screens' }}
        working-directory: code
      - name: Upload code coverage to GitHub
        if: matrix.category != 'static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-coverage-${{ matrix.category }}
          path: code/coverage/lcov.${{ matrix.category }}.info
          if-no-files-found: error

  coverage_report:
    name: Generate coverage report
    needs: testing
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@6c1aa0cc9e1c02f9f58f01ac599f1064ccc83470
      - name: Download code coverage from GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: coverage-artifacts
          pattern: code-coverage-*
          merge-multiple: true
      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@72cb85c549acad28913c9607dbd04af41bec7980
        with:
          coverage-files: coverage-artifacts/lcov.*.info
          minimum-coverage: 0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: false
