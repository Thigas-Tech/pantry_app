name: Deploy to Play Store

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter
        run: dart analyze lib/ test/

      - name: Run Flutter tests
        run: flutter test --concurrency=2

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 secret is empty — signing will fail"
            exit 1
          fi

      - name: Decode key properties
        env:
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -n "${KEY_PROPERTIES_BASE64}" ]; then
            echo "${KEY_PROPERTIES_BASE64}" | base64 -d > android/key.properties
          else
            echo "KEY_PROPERTIES_BASE64 secret is empty — signing will fail"
            exit 1
          fi

      - name: Build release App Bundle
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          printf 'OFF_USER_ID=%s\nOFF_PASSWORD=%s\nCONTACT_EMAIL=%s\n' \
            "$OFF_USER_ID" "$OFF_PASSWORD" "$CONTACT_EMAIL" > .env
          flutter build appbundle --release --dart-define-from-file=.env

      - name: Build release APK
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          printf 'OFF_USER_ID=%s\nOFF_PASSWORD=%s\nCONTACT_EMAIL=%s\n' \
            "$OFF_USER_ID" "$OFF_PASSWORD" "$CONTACT_EMAIL" > .env
          flutter build apk --release --dart-define-from-file=.env

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.thigas_tech.pantry_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error
