name: Deploy to Play Store

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  security_hardening:
    name: Check security hardening
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@46cfe808a5f1588656ef299eedd0ce2fd7ec0dcc

  deploy:
    name: Build and upload to Google Play
    needs: security_hardening
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Inject environment
        env:
          OFF_USER_ID: ${{ secrets.OFF_USER_ID }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
          USE_OFF_STAGING: ${{ vars.USE_OFF_STAGING || 'false' }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER || 'Thigas-Tech' }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO || 'pantry_app' }}
          FEEDBACK_ENABLED: ${{ vars.FEEDBACK_ENABLED || 'true' }}
          OPEN_PRICES_TOKEN: ${{ secrets.OPEN_PRICES_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FIREBASE_ENABLED: ${{ vars.FIREBASE_ENABLED || 'true' }}
        run: |
          env \
            | grep -E '^(OFF_USER_ID|OFF_PASSWORD|CONTACT_EMAIL|FEEDBACK_TOKEN|USE_OFF_STAGING|GITHUB_OWNER|GITHUB_REPO|FEEDBACK_ENABLED|OPEN_PRICES_TOKEN|USDA_API_KEY|FIREBASE_ENABLED)=' \
            > .env

      - name: Analyze Flutter
        run: dart analyze lib/ test/

      - name: Run Flutter tests
        run: flutter test --concurrency=2

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 secret is empty — signing will fail"
            exit 1
          fi

      - name: Decode key properties
        env:
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -n "${KEY_PROPERTIES_BASE64}" ]; then
            echo "${KEY_PROPERTIES_BASE64}" | base64 -d > android/key.properties
          else
            echo "KEY_PROPERTIES_BASE64 secret is empty — signing will fail"
            exit 1
          fi

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.thigas_tech.pantry_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error
