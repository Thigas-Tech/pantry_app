name: Firebase rules

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-test:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase_tests/package-lock.json

      - name: Setup Java 21 (Firestore emulator requirement)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        working-directory: firebase_tests

      - name: Run security rules against the emulator
        run: |
          ./firebase_tests/node_modules/.bin/firebase emulators:exec \
            --only firestore --project demo-pantry-app \
            'node firebase_tests/firestore.rules.test.js'

  deploy-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase_tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: firebase_tests

      - name: Deploy Firestore security rules
        if: github.ref == 'refs/heads/main' && env.FIREBASE_TOKEN != ''
        run: |
          ./firebase_tests/node_modules/.bin/firebase deploy \
            --only firestore:rules --project pantry-app-c5c36
