name: Patrol E2E

on:
  schedule:
    - cron: 0 3 * * 0
  workflow_dispatch:

jobs:
  patrol_e2e:
    name: Run Patrol E2E tests
    runs-on: macos-latest
    strategy:
      matrix:
        api-level:
          - 34
        target:
          - google_apis
        arch:
          - x86_64
    steps:
      - name: Clone the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Flutter
        uses: subosito/flutter-action@e14214cc42435fc0c2609c5e614a5e63a2fcd6f5
        with:
          channel: stable
      - name: Get Flutter packages
        run: flutter pub get
      - name: Setup Android SDK
        uses: android-actions/setup-android@e14e7e5b6cea0b4e56862d4ef4b7a605e50a8cb6
      - name: AVD cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}
      - name: Create AVD and run emulator
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b29cabeeeb7cec4612ac
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD ready"
      - name: Run emulator
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b29cabeeeb7cec4612ac
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            flutter test --no-pub --concurrency=2 integration_test/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patrol-e2e-results
          path: |
            build/patrol/
            build/app/outputs/flutter-apk/
          retention-days: 14
