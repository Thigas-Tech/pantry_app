name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/pr-labeler.yml
