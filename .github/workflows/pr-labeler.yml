name: PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d  # v6.2.0
        with:
          configuration-path: .github/pr-labeler.yml
