name: tmp-update-goldens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/audit-code-quality-q1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: flutter test --update-goldens test/screens/home_screen_golden_test.dart
      - name: Commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screens/goldens/
          git commit -m "chore: regenerate home screen golden on CI SDK" || echo "no changes"
          git push origin feat/audit-code-quality-q1
