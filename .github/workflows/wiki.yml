name: Update Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-wiki:
    name: Publish API docs to wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate API documentation
        run: dart doc .

      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Sync documentation to wiki
        run: |
          cd wiki
          # Preserve hand-maintained files
          for f in Home.md _Sidebar.md _Footer.md .git; do
            echo "Preserving $f"
          done
          # Remove all auto-generated content
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'Home.md' \
            ! -name '_Sidebar.md' \
            ! -name '_Footer.md' \
            ! -name '.git' \
            -exec rm -rf {} +
          # Copy fresh docs
          cp -r ../doc/api/* .
          # Ensure hand-maintained files still exist (create empty if missing)
          touch Home.md _Sidebar.md _Footer.md

      - name: Push to wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to wiki"
          else
            git commit -m "Update API docs [skip ci]"
            git push
            echo "Wiki updated successfully"
          fi
