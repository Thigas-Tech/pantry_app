name: Update API Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy API docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate API documentation
        run: dart doc .

      - name: Deploy API docs to gh-pages via worktree
        run: |
          set -e
          git fetch origin gh-pages --depth=1 || {
            echo "gh-pages branch does not exist yet; run initial setup first"
            exit 1
          }
          git worktree add --detach "$RUNNER_TEMP/gh-pages" FETCH_HEAD
          trap 'git worktree remove --force "$RUNNER_TEMP/gh-pages" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/gh-pages"
          rm -rf api
          mv "$GITHUB_WORKSPACE/doc/api" api
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to API docs"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "Update API docs [skip ci]"
            git push origin HEAD:gh-pages
            echo "API docs deployed to gh-pages"
          fi
