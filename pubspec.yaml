name: pantry_app
description: "Offline first pantry manager"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.9+5

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  cloud_firestore: ^6.7.1
  crypto: ^3.0.7
  diacritic: ^0.1.6
  dynamic_color: ^1.8.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  http: ^1.2.0
  image: ^4.9.1
  image_picker: ^1.2.3
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.2.0
  openfoodfacts: ^3.30.2
  package_info_plus: ^10.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  riverpod_annotation: ^4.0.3
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  lint: ^2.8.0
  mocktail: ^1.0.5
  openfoodfacts_flutter_lints:
    git: https://github.com/openfoodfacts/openfoodfacts_flutter_lints.git
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  very_good_analysis: ^10.3.0
  vm_service: ^15.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - CHANGELOG.md
    - USER_CHANGELOG.md
    - USER_CHANGELOG_pt.md
    - USER_CHANGELOG_pt_BR.md

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"   # or any solid colour that matches your icon
  adaptive_icon_foreground: "assets/icon/icon.png"
